name: QXZB
options:
  bundleIdPrefix: com.ishii
  # runner 上是 Xcode 15.4，必须让 xcodegen 生成兼容格式（否则 objectVersion=77 打不开）
  xcodeVersion: "15.4"
  deploymentTarget:
    iOS: "13.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    ENABLE_BITCODE: "NO"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"

targets:
  QXZB:
    type: application
    platform: iOS
    deploymentTarget: "13.0"
    sources:
      # 应用源码（Swift / JS / Assets）；Info.plist 由 info: 生成，排除以免重复打包
      - path: QXZB
        excludes:
          - "Info.plist"
      # 离线 H5 包，作为“蓝色文件夹引用”整体拷入 App bundle（保留 web/ 目录结构）
      - path: web
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ishii.qxzb
        PRODUCT_NAME: QXZB
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: QXZB/Info.plist
      properties:
        CFBundleDisplayName: 七雄争霸
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true

schemes:
  QXZB:
    build:
      targets:
        QXZB: all
    run:
      config: Debug
    archive:
      config: Release
