name: diag
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ '.github/workflows/diag.yml' ]

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - name: linux ok
        run: |
          echo "linux runner alive"
          uname -a

  mac:
    runs-on: macos-14
    steps:
      - name: mac ok
        run: |
          echo "mac runner alive"
          sw_vers
          xcodebuild -version
