name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths-ignore:
      - 'web/**'
      - 'README.md'

concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 150

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          python3 --version
          sw_vers

      # 仓库默认不提交 ~500MB 的 H5 资源；构建时从公开 CDN 全量抓取。
      # 若你已把 web/ 提交进仓库，此步自动跳过。
      - name: Fetch H5 bundle (full)
        run: |
          if [ -f web/index.html ]; then
            echo "web/ already present, skip fetch"
          else
            python3 tools/fetch_h5.py --out web --jobs 32 || true
          fi
          # eui 主题文件不在 default.res.json 清单里，必须单独补抓（缺它会卡在加载 100%）
          python3 tools/fetch_extra.py --web web --jobs 32 || true
          echo "--- web 概览 ---"
          du -sh web 2>/dev/null || true
          ls -la web | head -20
          test -f web/index.html
          test -f web/manifest.json
          test -f web/js.zip
          test -f web/resource/default.thm.json
          echo "thm.json 大小: $(stat -f%z web/resource/default.thm.json 2>/dev/null || stat -c%s web/resource/default.thm.json)"

      - name: Install XcodeGen
        run: |
          brew install xcodegen || brew upgrade xcodegen
          xcodegen --version

      # WKWebView 里没有安卓原生 JSBridge，必须打三处补丁：
      #   1) thm.js / thm.json 皮肤表补全（否则 3555 个界面全透明）
      #   2) 启动链路跳过 JSBridge.initGame()
      #   3) index.html 注入 window.mobileHall 自动登录参数
      - name: Apply WebView patches
        run: |
          python3 tools/apply_patches.py web
          echo "--- 校验 ---"
          grep -c 'mobileHall' web/index.html
          node --check web/js/main.min.js 2>/dev/null || echo "(no node, skip syntax check)"

      - name: Generate Xcode project
        run: |
          xcodegen generate
          PBX=QXZB.xcodeproj/project.pbxproj
          echo "--- 生成后格式 ---"
          grep -E 'objectVersion|compatibilityVersion|preferredProjectObjectVersion' "$PBX" | head -5
          # macos-14 默认 Xcode 15.4，不支持 objectVersion 77（Xcode 16 格式）；强制降级
          sed -i '' -E 's/objectVersion = [0-9]+;/objectVersion = 56;/' "$PBX"
          sed -i '' -E 's/compatibilityVersion = "Xcode [0-9.]+";/compatibilityVersion = "Xcode 14.0";/' "$PBX"
          sed -i '' -E '/preferredProjectObjectVersion = [0-9]+;/d' "$PBX"
          echo "--- 降级后 ---"
          grep -E 'objectVersion|compatibilityVersion|preferredProjectObjectVersion' "$PBX" | head -5
          plutil -lint QXZB.xcodeproj/project.pbxproj || true

      - name: Build (unsigned, device)
        run: |
          set -o pipefail
          xcodebuild \
            -project QXZB.xcodeproj \
            -scheme QXZB \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            build

      - name: Package unsigned IPA
        run: |
          APP="build/Build/Products/Release-iphoneos/QXZB.app"
          echo "APP=$APP"
          test -d "$APP" || { echo "build output missing"; exit 1; }
          du -sh "$APP"
          rm -rf Payload QXZB-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry QXZB-unsigned.ipa Payload
          ls -lh QXZB-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: QXZB-unsigned-ipa
          path: QXZB-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      # 只传「非 web」部分（二进制/Frameworks/Assets.car/Info.plist，几 MB）。
      # 国内直连 GitHub artifacts 只有 ~50KB/s，325MB 要一个多小时；
      # 本地已有打好补丁的 web/，只需要这个包里的新二进制来重封。
      - name: Upload app payload only (no web)
        run: |
          APP="build/Build/Products/Release-iphoneos/QXZB.app"
          rm -rf mini && mkdir -p mini/Payload
          cp -R "$APP" mini/Payload/
          rm -rf mini/Payload/QXZB.app/web
          mkdir -p mini/Payload/QXZB.app/web
          echo placeholder > mini/Payload/QXZB.app/web/.keep
          cd mini && zip -qry QXZB-app-payload.zip Payload
          ls -lh QXZB-app-payload.zip
          shasum -a 256 QXZB-app-payload.zip

      - name: Upload payload artifact
        uses: actions/upload-artifact@v4
        with:
          name: QXZB-app-payload
          path: mini/QXZB-app-payload.zip
          if-no-files-found: error
          retention-days: 30
